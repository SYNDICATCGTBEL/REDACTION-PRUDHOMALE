name: Publier une version Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publication:
    name: Construire et publier
    runs-on: windows-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire la mise à jour
        run: npm run dist

      - name: Publier la version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installateur = "dist/Redaction-prudhomale-$version-setup.exe"
          $blockmap = "$installateur.blockmap"
          gh release create "v$version" $installateur $blockmap "dist/latest.yml" --verify-tag --title "Version $version" --notes "Correction et mise à jour de Rédaction prud’homale." --latest

      - name: Conserver les deux dernières versions publiées
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $versions = gh release list --exclude-drafts --limit 100 --json tagName,publishedAt --jq 'sort_by(.publishedAt) | reverse | .[].tagName'
          $versionsASupprimer = @($versions | Select-Object -Skip 2)
          foreach ($version in $versionsASupprimer) {
            gh release delete $version --yes
          }
