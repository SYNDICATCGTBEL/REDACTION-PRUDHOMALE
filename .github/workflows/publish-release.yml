name: Publier une version Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publication:
    name: Construire et publier
    runs-on: windows-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire et publier la mise à jour
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Conserver les deux dernières versions publiées
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $versions = gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[].tagName'
          $versionsASupprimer = @($versions | Select-Object -Skip 2)
          foreach ($version in $versionsASupprimer) {
            gh release delete $version --yes
          }
